name: Build Home Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 安装器通过 GitHub API 查询版本，带上 token 避免被限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Verify Keystore
        id: keystore
        shell: bash
        env:
          KEEP_KEYSTORE_BASE64: ${{ secrets.KEEP_KEYSTORE_BASE64 }}
          KEEP_KEYSTORE_PASSWORD: ${{ secrets.KEEP_KEYSTORE_PASSWORD }}
          KEEP_KEY_ALIAS: ${{ secrets.KEEP_KEY_ALIAS }}
          KEEP_KEY_PASSWORD: ${{ secrets.KEEP_KEY_PASSWORD }}
        run: |
          umask 077
          if [[ -e local.properties || -L local.properties ]]; then
            echo '::error::Expected a clean checkout without local.properties.'
            exit 1
          fi
          signing_dir=$(mktemp -d "$RUNNER_TEMP/home-signing.XXXXXX")
          trap 'rm -f -- local.properties "$signing_dir/home-release.p12"; rmdir -- "$signing_dir"' EXIT

          python3 - "$signing_dir/home-release.p12" <<'PY'
          import base64
          import binascii
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          store_password = os.environ.get("KEEP_KEYSTORE_PASSWORD", "").strip()
          key_password = os.environ.get("KEEP_KEY_PASSWORD", "").strip()
          alias = os.environ.get("KEEP_KEY_ALIAS", "").strip()
          keystore_path = Path(sys.argv[1])

          def fail(message):
              size = keystore_path.stat().st_size if keystore_path.is_file() else 0
              print(f"PKCS12 bytes: {size}", file=sys.stderr)
              print(f"KEEP_KEYSTORE_PASSWORD characters: {len(store_password)}", file=sys.stderr)
              print(f"KEEP_KEY_PASSWORD characters: {len(key_password)}", file=sys.stderr)
              print(f"KEEP_KEY_ALIAS characters: {len(alias)}", file=sys.stderr)
              print(f"Passwords match: {'yes' if store_password == key_password else 'no'}", file=sys.stderr)
              sys.exit(f"::error::{message}")

          try:
              encoded = "".join(os.environ.get("KEEP_KEYSTORE_BASE64", "").split())
              keystore = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError):
              fail("keytool not run: invalid KEEP_KEYSTORE_BASE64.")
          if not keystore:
              fail("keytool not run: empty keystore.")
          keystore_path.write_bytes(keystore)
          if not all((store_password, key_password, alias)):
              fail("keytool not run: an empty signing parameter remains after trimming.")

          def safe_keytool_error(output):
              # Print only known error text. Raw output can contain the alias or credentials.
              for line in output.splitlines():
                  if not line.startswith("keytool error: "):
                      continue
                  detail = line.removeprefix("keytool error: ")
                  if detail in (
                      "java.io.IOException: keystore password was incorrect",
                      "java.io.IOException: Invalid keystore format",
                      "java.security.UnrecoverableKeyException: Cannot recover key",
                  ):
                      return line
                  if re.fullmatch(r"java\.lang\.Exception: Alias <.*> does not exist", detail):
                      return "keytool error: java.lang.Exception: Alias <redacted> does not exist"
                  if re.fullmatch(r"java\.lang\.Exception: Alias <.*> has no key", detail):
                      return "keytool error: java.lang.Exception: Alias <redacted> has no key"
                  match = re.match(r"(java(?:\.[A-Za-z]+)+\.[A-Za-z]+(?:Exception|Error)):", detail)
                  if match:
                      return f"keytool error: {match.group(1)}: [details redacted]"
              return "keytool failed: no safe error line available."

          keytool = Path(os.environ["JAVA_HOME"]) / "bin" / ("keytool.exe" if os.name == "nt" else "keytool")
          arguments = [
              "-J-Duser.language=en", "-J-Duser.country=US",
              "-keystore", str(keystore_path), "-storetype", "PKCS12",
              "-alias", alias, "-storepass:env", "KEEP_KEYSTORE_PASSWORD",
          ]
          keytool_env = dict(os.environ, KEEP_KEYSTORE_PASSWORD=store_password, KEEP_KEY_PASSWORD=key_password)
          keytool_env.pop("KEEP_KEYSTORE_BASE64", None)
          keytool_env.pop("KEEP_KEY_ALIAS", None)

          try:
              result = subprocess.run(
                  [str(keytool), "-list", *arguments],
                  env=keytool_env, capture_output=True, text=True, errors="replace",
              )
          except OSError:
              fail("keytool could not be started.")
          if result.returncode:
              fail(safe_keytool_error(result.stdout + "\n" + result.stderr))

          # keytool -list checks the store and alias, but does not decrypt the private key.
          with tempfile.TemporaryDirectory(dir=keystore_path.parent) as probe_dir:
              probe = Path(probe_dir) / "VerifyPrivateKey.java"
              probe.write_text(r"""
          import java.io.InputStream;
          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.security.KeyStore;
          import java.security.PrivateKey;
          import java.security.UnrecoverableKeyException;

          class VerifyPrivateKey {
              public static void main(String[] args) throws Exception {
                  KeyStore store = KeyStore.getInstance("PKCS12");
                  try (InputStream input = Files.newInputStream(Paths.get(args[0]))) {
                      store.load(input, System.getenv("KEEP_KEYSTORE_PASSWORD").toCharArray());
                  }
                  try {
                      if (!(store.getKey(args[1], System.getenv("KEEP_KEY_PASSWORD").toCharArray()) instanceof PrivateKey)) {
                          System.exit(3);
                      }
                  } catch (UnrecoverableKeyException error) {
                      System.exit(2);
                  }
              }
          }
          """, encoding="ascii")
              executable_suffix = ".exe" if os.name == "nt" else ""
              java_bin = keytool.parent
              try:
                  compiled = subprocess.run(
                      [str(java_bin / ("javac" + executable_suffix)), str(probe)],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  )
                  if compiled.returncode:
                      fail("keytool -list passed; the private key check could not be compiled.")
                  checked = subprocess.run(
                      [str(java_bin / ("java" + executable_suffix)), "-cp", probe_dir,
                       "VerifyPrivateKey", str(keystore_path), alias],
                      env=keytool_env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  )
              except OSError:
                  fail("keytool -list passed; the private key check could not be started.")
              if checked.returncode == 2:
                  fail("keytool -list passed; Java could not decrypt the private key with KEEP_KEY_PASSWORD.")
              if checked.returncode == 3:
                  fail("keytool -list passed; the alias does not contain a private key.")
              if checked.returncode:
                  fail("keytool -list passed; the private key check failed.")

          def property_value(value):
              data = value.encode("utf-16-be")
              return "".join(
                  f"\\u{int.from_bytes(data[index:index + 2], 'big'):04x}"
                  for index in range(0, len(data), 2)
              )

          values = {
              "storeFile": str(keystore_path),
              "storePassword": store_password,
              "keyAlias": alias,
              "keyPassword": key_password,
          }
          Path("local.properties").write_text(
              "".join(f"{name}={property_value(value)}\n" for name, value in values.items()),
              encoding="ascii",
          )
          PY

          printf 'signing_dir=%s\n' "$signing_dir" >> "$GITHUB_OUTPUT"
          trap - EXIT

      - name: Build signed Home Release
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --no-configuration-cache --no-daemon

      - name: Remove temporary signing files
        if: ${{ always() && steps.keystore.outputs.signing_dir != '' }}
        shell: bash
        env:
          SIGNING_DIR: ${{ steps.keystore.outputs.signing_dir }}
        run: |
          rm -f -- local.properties "$SIGNING_DIR/home-release.p12"
          rmdir -- "$SIGNING_DIR"

      - name: Verify signed APK identity and providers
        shell: bash
        run: |
          apk=$(python3 - <<'PY'
          import json
          from pathlib import Path

          output_dir = Path("app/build/outputs/apk/github/release")
          metadata = json.loads((output_dir / "output-metadata.json").read_text(encoding="utf-8"))
          if metadata["variantName"] != "githubRelease":
              raise SystemExit("::error::Expected output metadata for githubRelease.")
          universal = [entry["outputFile"] for entry in metadata["elements"] if not entry["filters"]]
          if len(universal) != 1:
              raise SystemExit("::error::Expected exactly one universal GitHub Release APK.")
          apk = output_dir / universal[0]
          if apk.parent != output_dir or apk.suffix != ".apk" or not apk.is_file():
              raise SystemExit("::error::Universal APK listed in output metadata is missing.")
          print(apk)
          PY
          )
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$sdk_root/build-tools/36.0.0"
          if [[ ! -x "$build_tools/aapt2" || ! -x "$build_tools/apksigner" ]]; then
            echo '::error::Android SDK Build-Tools 36.0.0 are missing.'
            exit 1
          fi

          apkanalyzer="$sdk_root/cmdline-tools/latest/bin/apkanalyzer"
          if [[ ! -x "$apkanalyzer" ]]; then
            apkanalyzer=''
            for candidate in "$sdk_root"/cmdline-tools/*/bin/apkanalyzer; do
              if [[ -x "$candidate" ]]; then
                apkanalyzer="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$apkanalyzer" ]]; then
            echo '::error::apkanalyzer is missing from the runner Android SDK.'
            exit 1
          fi
          badging=$("$build_tools/aapt2" dump badging "$apk")
          package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")
          label=$(sed -n "s/^application-label:'\(.*\)'$/\1/p" <<< "$badging")
          expected_label=$(sed -nE 's/^[[:space:]]*resValue\("string", "home_app_name", "([^"]+)"\)[[:space:]]*$/\1/p' app/build.gradle.kts)
          if [[ -z "$expected_label" || "$expected_label" == *$'\n'* ]]; then
            echo '::error::Expected one home_app_name definition in app/build.gradle.kts.'
            exit 1
          fi
          if [[ "$package" != 'me.rerere.rikkahub.keep' || "$label" != "$expected_label" ]]; then
            echo "::error::Unexpected APK package or label: $package / $label"
            exit 1
          fi
          localized_labels=$(sed -nE "s/^application-label-[^:]+:'(.*)'$/\1/p" <<< "$badging")
          if [[ -n "$localized_labels" ]] && grep -Fvx -- "$expected_label" <<< "$localized_labels"; then
            echo "::error::A localized APK label differs from home_app_name ($expected_label)."
            exit 1
          fi

          "$apkanalyzer" manifest print "$apk" |
            python3 -c '
          import sys
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          package = "me.rerere.rikkahub.keep"
          manifest = ET.parse(sys.stdin)
          authorities = set()
          for provider in manifest.findall("./application/provider"):
              values = provider.get(android + "authorities", "").split(";")
              if any(not value.startswith(package + ".") for value in values):
                  sys.exit("::error::An APK provider authority is outside the Home package.")
              authorities.update(values)

          expected = {package + "." + name for name in ("fileprovider", "documents", "androidx-startup")}
          if not expected.issubset(authorities):
              sys.exit("::error::An expected Home provider authority is missing.")
          '

          "$build_tools/apksigner" verify "$apk"
          install -D -m 0644 "$apk" "$RUNNER_TEMP/home-release/Home-release.apk"

      - name: Upload Home Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Home-release-apk
          path: ${{ runner.temp }}/home-release/Home-release.apk
          if-no-files-found: error
